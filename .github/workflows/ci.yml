name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run verify
      - name: Knowledge dedup review (warning only)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        # 索引校验核对保留 PDF 页数，需要 poppler 的 pdfinfo
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -B 知识库/工具/语义预审.py --check

  gate:
    name: ci-verify
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms to pass
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: node -e "if (process.env.VERIFICATION_RESULT !== 'success') process.exit(1)"
