name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      # 语音接口靠 ffmpeg 转码成 16kHz 单声道；windows-latest 默认没有 ffmpeg
      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg --no-progress -y
      - name: Check ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: ffmpeg -version
      # ubuntu-latest 同样没有预装 ffmpeg，语音接口转码需要它。
      # 注意：不要加 apt-get update——CI #645 里 update + 全量安装花了 12m22s，
      # 撞上 15 分钟 job 上限。runner 镜像自带 apt 列表（同文件的 poppler 步骤
      # 也是不 update 直接装），--no-install-recommends 再砍掉推荐依赖包，
      # 整步约 1 分钟，给 verify（约 5–9 分钟）留够时间。
      - name: Install ffmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check ffmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ffmpeg -version
      - run: npm run verify
      - name: Knowledge dedup review (warning only)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        # 索引校验核对保留 PDF 页数，需要 poppler 的 pdfinfo
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -B 知识库/工具/语义预审.py --check

  gate:
    name: ci-verify
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms to pass
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: node -e "if (process.env.VERIFICATION_RESULT !== 'success') process.exit(1)"
