name: Development preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      # verify includes voice transcoding tests; match the Ubuntu CI dependency.
      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check ffmpeg
        run: ffmpeg -version
      - run: npm run verify
      - run: npm run build:dev-preview
      - name: Publish the development artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-preview-artifact.mjs
