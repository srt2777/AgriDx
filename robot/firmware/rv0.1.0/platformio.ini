; 司稼小机器人 RV0.1.0 固件 — PlatformIO 工程
; 板子：ESP32-S3-N16R8（16MB Flash + 8MB PSRAM，Octal PSRAM）
; 屏幕（默认）：DZYJ 3.2 寸 SPI 触摸屏，ILI9341 320x240 + XPT2046
; 换屏：改 include/display_config.h 里一个宏，见 README.md
; 烧录：pio run -t upload（或用生成的 .bin + esptool，见 docs/FLASHING.md）
; 默认环境是 S3；C3 是过渡版：pio run -e esp32-c3-devkitm-1（见 docs/FLASHING.md §9）

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  ; 屏幕配置档：默认 ILI9341_320x240；换屏时改这里（与 display_config.h 保持一致）
  -DSCREEN_PROFILE_ILI9341_320X240
  -DENABLE_OTA=1
lib_deps =
  lvgl/lvgl@^9.2.0
  bodmer/TFT_eSPI@^2.5.0
  bblanchon/ArduinoJson@^7.0.0
  ; XPT2046_Touchscreen 未在 PlatformIO 注册表用该 owner/版本上架，改用官方 GitHub 直链
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---- ESP32-C3 过渡版（临时顶替 S3，不是新版本；S3 到了换回 S3 环境）----
; 板型默认 esp32-c3-devkitm-1；自己的板子不同就改下面 board 这一行。
; 4MB Flash，单 app 分区（partitions_c3.csv），无 OTA：OTA 代码在 C3 环境下编译关掉。
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DSCREEN_PROFILE_ILI9341_320X240
  -DENABLE_OTA=0
lib_deps =
  lvgl/lvgl@^9.2.0
  bodmer/TFT_eSPI@^2.5.0
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
