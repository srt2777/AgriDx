; 司稼小机器人 RV0.1.0 固件 — PlatformIO 工程
; 板子（默认环境）：ESP32-S3-N16R8（16MB Flash + 8MB PSRAM，Octal PSRAM）
; 屏幕（默认）：DZYJ 3.2 寸 SPI 触摸屏，ILI9341 320x240 + XPT2046
; 换屏：改 include/display_config.h 里一个宏，见 README.md
; 烧录：pio run -t upload（默认环境 S3；C3 必须加 -e，见下；或用生成的 .bin + esptool，见 docs/FLASHING.md）
; 默认环境是 S3（default_envs = esp32-s3-n16r8）；不带 -e 的命令一律按 S3 编译烧录——
; VS Code 左下角状态栏显示的环境不作数，烧 C3 前先核对终端命令里有没有 -e esp32-c3-devkitm-1
; （见 docs/FLASHING.md §2.1；实测：状态栏已切到 C3，Upload 仍可能按 S3 跑，报错 Wrong chip argument?）
; C3 是过渡版：pio run -e esp32-c3-devkitm-1（编译）、pio run -e esp32-c3-devkitm-1 -t upload（烧录），见 docs/FLASHING.md §9
; C3 + 0.96 寸 OLED 版：pio run -e esp32-c3-devkitm-1-oled（显示用 U8g2 + SSD1306，见下）

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 115200
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -Iinclude
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  ; 屏幕配置档：默认 ILI9341_320x240；换屏时改这里（与 display_config.h 保持一致）
  -DSCREEN_PROFILE_ILI9341_320X240
  -DENABLE_OTA=0  ; Use password-protected Wi-Fi OTA, not the legacy unauthenticated updater.
  ; RV0.2.0 语音（S3 专用）：只在 S3 环境编 src/voice.cpp；
  ; C3 两个环境传 0 且 build_src_filter 排除 voice.cpp，不编语音代码、不增体积。
  -DSIJIA_VOICE_ENABLED=1
; 构建前修补 TFT_eSPI 的 S3 头文件（REG_SPI_BASE 基址算成 0，tft.init() 写 0x10 崩溃，见脚本头注释）。
extra_scripts = pre:tools/patch_tft_espi_s3.py
lib_deps =
  lvgl/lvgl@9.6.0
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.0.0
  ; XPT2046_Touchscreen 未在 PlatformIO 注册表用该 owner/版本上架，改用官方 GitHub 直链
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---- ESP32-C3 过渡版（临时顶替 S3，不是新版本；S3 到了换回 S3 环境）----
; 板型默认 esp32-c3-devkitm-1；自己的板子不同就改下面 board 这一行。
; 4MB Flash，单 app 分区（partitions_c3.csv），无 OTA：OTA 代码在 C3 环境下编译关掉。
; 编译：pio run -e esp32-c3-devkitm-1；烧录：pio run -e esp32-c3-devkitm-1 -t upload。
; 注意：不带 -e 的 pio run / Upload 一律走默认的 S3 环境（见文件头注释）。
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
  +<*>
  -<voice.cpp>
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DSCREEN_PROFILE_ILI9341_320X240
  -DENABLE_OTA=0
  -DSIJIA_VOICE_ENABLED=0
lib_deps =
  lvgl/lvgl@^9.2.0
  bodmer/TFT_eSPI@^2.5.0
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---- ESP32-C3 + 3.2 寸触摸屏版（RV0.1.0 的第三个显示版本；原 C3 板接 ILI9341 屏）----
; 板型 esp32-c3-devkitm-1（合宙 LuatOS C3，不是 SuperMini）；分区表沿用 partitions_c3.csv
; （单 app，约 2.9MB；LVGL TFT v2 固件约 2MB，放得下）；无 OTA。
; 显示：LVGL 9 原生界面（TFT UI v2，从 S3 分支 codex/robot-s3-tft-20261110 选择性移植，
; 语音 #249 与 WiFi #258 的改动原样保留），ILI9341 320x240 + XPT2046，SPI 先 10MHz。
; 引脚（见 display_config.h 的 SIJIA_C3_TFT 一节）：MOSI 7 / MISO 5 / SCK 6 / CS 4 /
; DC 3 / RST 10 / BL 1 / T_CS 0 / T_IRQ 12。屏 VCC 只能接 3V3，绝不能接 5V。
; Flash 必须是 DIO 40m（与 OLED 环境同理；合宙板外置闪存只接了 DIO 两根数据线，
; QIO 读分区表会出错 0xfcde），不要照旧 C3 过渡环境（默认 QIO）烧这块板。
; 内存（C3 单核 160MHz、无 PSRAM、约 400KB SRAM）：LV_MEM_SIZE 48KB（见 lv_conf.h）、
; 绘图双缓冲各 10 行（见 main.cpp DRAW_BUF_LINES），PARTIAL 渲染。
; 编译：pio run -e esp32-c3-devkitm-1-tft；烧录：pio run -e esp32-c3-devkitm-1-tft -t upload，
; 或用生成的 firmware.bin（只烧 0x10000，不擦 NVS，见 docs/FLASHING.md §9）。
; 注意：不要动 S3 环境与 OLED 环境；本环境只用 -DSIJIA_C3_TFT=1 隔离 C3 TFT 的部分。
[env:esp32-c3-devkitm-1-tft]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.flash_freq = 40m
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
  +<*>
  -<voice.cpp>
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DSCREEN_PROFILE_ILI9341_320X240
  -DENABLE_OTA=0
  -DSIJIA_VOICE_ENABLED=0
  -DSIJIA_C3_TFT=1
; 构建前修补 TFT_eSPI 的 C3 头文件（REG_SPI_BASE 基址算成 0 导致 tft.init() 开机即崩，见脚本头注释）。
; TFT_eSPI 钉在 2.5.43（补丁针对此版本；S3 / OLED 环境不动）。
extra_scripts = pre:tools/patch_tft_espi_c3.py
lib_deps =
  lvgl/lvgl@^9.2.0
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---- ESP32-C3 + 0.96 寸 OLED 版（RV0.1.0 的第二个显示版本；3.2 寸 LVGL 版不动）----
; 板型 esp32-c3-devkitm-1；分区表沿用 partitions_c3.csv（单 app，约 2.9MB）；无 OTA。
; 显示：U8g2 + SSD1306 128x64 I2C（地址 0x3C），SDA=GPIO12、SCL=GPIO13（见 display_config.h）。
; 字库：U8g2 自带 wqy16（GB2312，16px）。不用小子集字库的原因见 src/oled_ui.cpp 头注释：
; 问答页显示服务器返回的答案，字符集事先不可穷举，子集只能覆盖固定文案。
; 编译宏 -DUSE_OLED_DISPLAY=1：开时编 OLED UI，关时编原来的 LVGL TFT UI。
; 注意：src/fonts/ 是 LVGL 字库（含 lvgl.h），OLED 版不编，build_src_filter 已排除。
[env:esp32-c3-devkitm-1-oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
; CORE-ESP32 板（合宙 LuatOS，MX25L3236F 外置闪存）只接了 DIO 两根数据线
; （D0=GPIO16、D1=GPIO17，HD=GPIO12、WP=GPIO13 没连闪存），QIO 读分区表会出错
; （0xfcde）。必须用 DIO，否则启动器读不到分区表。
board_build.flash_mode = dio
board_build.flash_freq = 40m
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
  +<*>
  -<fonts/>
  -<voice.cpp>
build_flags =
  -Iinclude
  -DUSE_OLED_DISPLAY=1
  -DENABLE_OTA=0
  -DSIJIA_VOICE_ENABLED=0
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  olikraus/U8g2@^2.0.0
